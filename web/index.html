<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Token Meter</title>
<script>
// Stamp the theme before first paint. Without this the page renders light, then
// snaps to dark once app.js runs — a flash on every single navigation.
(function () {
  try {
    var saved = localStorage.getItem('tm.theme');
    var t = saved === 'light' || saved === 'dark' ? saved
      : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', t);
  } catch (e) {}
})();
</script>
<!-- Ahead of the stylesheet: the CSS only asks for these once it has parsed
     @font-face, by which point first paint has already happened in a system
     face and every number shifts a pixel when Inter lands. -->
<link rel="preload" href="/web/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/web/style.css">
<script src="/web/echarts.min.js"></script>
</head>
<body>
<main id="app"><p class="empty" style="padding:56px">Token Meter — loading…</p></main>
<script type="module" src="/web/app.js"></script>
</body>
</html>
