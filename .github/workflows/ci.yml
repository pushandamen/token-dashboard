name: CI

on:
  push:
  pull_request:

# The project is stdlib-only by design (see CLAUDE.md § Conventions), so there is
# nothing to install — CI just runs the unittest suite on the oldest and newest
# Python the README claims support for.
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover tests -v
